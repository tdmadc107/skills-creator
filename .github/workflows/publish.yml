name: Publish to npm

# Runs when a version tag is pushed, for example: git tag v1.3.0 && git push origin v1.3.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      # Lets npm authenticate through trusted publishing (OIDC) once it is configured for the package.
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@^11.5.1
      - name: Check the tag, the versions and the branch
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const skill = fs.readFileSync(".skills/skills-creator/SKILL.md", "utf8").match(/^  version: (\S+)$/m)?.[1];
            const tag = process.env.TAG;
            const fail = (message) => { console.error(`::error::${message}`); process.exit(1); };
            if (!/^v\d+\.\d+\.\d+$/.test(tag)) fail(`the tag ${tag} is not of the form v<major>.<minor>.<patch>`);
            if (tag !== `v${pkg.version}`) fail(`the tag ${tag} does not match package.json version ${pkg.version}`);
            if (skill !== pkg.version) fail(`SKILL.md version ${skill} does not match package.json version ${pkg.version}`);
          '
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::the tagged commit is not on main; tag a commit of main"; exit 1; }
          if npm view "$(node -p 'require("./package.json").name')@$(node -p 'require("./package.json").version')" version >/dev/null 2>&1; then
            echo "::error::this version is already on npm; bump the version before tagging"; exit 1
          fi
      - name: Publish
        # NPM_TOKEN is needed only until trusted publishing is configured on npmjs.com; npm then uses OIDC.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
